<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>拼音乐园</title>
<!-- 让平板可以“添加到主屏幕”，像 App 一样全屏打开 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="拼音乐园">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; }
  /* 触屏优化：快速连点不放大页面，点按时不出现灰色高亮，不会误选中文字 */
  button, .word, .char-big { touch-action: manipulation; -webkit-tap-highlight-color: transparent;
                             -webkit-user-select: none; user-select: none; }
  body {
    margin: 0;
    /* 全屏 App 模式下避开 iPad 的圆角和状态栏 */
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
             max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #fff6e5, #e8f6ff);
    color: #333; min-height: 100vh;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 8px; }
  h1 { color: #ff7a45; margin: 0; font-size: 26px; }
  .tabs { display: flex; gap: 8px; }
  .tab {
    border: none; border-radius: 18px; padding: 6px 18px; font-size: 17px;
    background: #fff; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.1);
  }
  .tab.active { background: #ff7a45; color: #fff; }
  /* 左边选按钮，右边固定显示结果，不用上下滑动 */
  .layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); gap: 10px; align-items: start; }
  .result { position: sticky; top: 8px; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .result { position: static; } }
  .panel { background: #fff; border-radius: 14px; padding: 8px 12px; margin-bottom: 8px;
           box-shadow: 0 3px 10px rgba(0,0,0,.06); }
  .panel h3 { margin: 0 0 6px; font-size: 15px; color: #666; }
  .panel h3 .sub { font-size: 13px; color: #aaa; font-weight: normal; }
  .kind { display: inline-block; margin-left: 8px; padding: 1px 10px; font-size: 15px;
          border-radius: 12px; background: #fff0f6; color: #c41d7f; vertical-align: middle; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .py-btn {
    min-width: 46px; height: 42px; padding: 0 8px; font-size: 20px;
    border: 3px solid transparent; border-radius: 10px; cursor: pointer;
    font-family: "Arial", sans-serif; transition: transform .1s;
  }
  @media (hover: hover) { .py-btn:hover { transform: scale(1.08); } }   /* 触屏没有悬停，避免按钮一直放大 */
  .py-btn:active { transform: scale(0.95); }
  .py-btn.sel { border-color: #333; transform: scale(1.08); }
  .g-initial { background: #d6ecff; color: #1765ad; }
  .g-medial  { background: #efe0ff; color: #6b2fb3; }
  .g-final   { background: #ffe7cc; color: #c25400; }
  .g-whole   { background: #ffe0e6; color: #c41d4a; }
  .g-tone    { background: #dcf5d6; color: #2b7a1e; position: relative; }
  .g-tone.has::after {   /* 有字的声调右上角加个小圆点 */
    content: ""; position: absolute; top: 4px; right: 4px;
    width: 9px; height: 9px; border-radius: 50%; background: #ff4d4f;
  }
  .formula { text-align: center; font-size: 22px; color: #888; min-height: 32px; }
  .big-py { text-align: center; font-size: 52px; font-family: Arial, sans-serif;
            color: #ff7a45; min-height: 64px; font-weight: bold; line-height: 1.2; }
  .msg { text-align: center; font-size: 16px; padding: 5px 10px; border-radius: 10px; margin: 4px auto; max-width: 720px; }
  .msg.err  { background: #fff1f0; color: #cf1322; }
  .msg.tip  { background: #e6f7ff; color: #0958d9; }
  .msg.ok   { background: #f6ffed; color: #389e0d; }
  .chars { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
  .char-card { background: #fffbe6; border: 3px solid #ffd666; border-radius: 14px;
               padding: 4px 12px; text-align: center; min-width: 120px; }
  .char-big { font-size: 52px; cursor: pointer; line-height: 1.2; }
  .word { display: inline-block; margin: 3px; padding: 2px 10px; font-size: 18px;
          background: #fff; border: 2px solid #ffc53d; border-radius: 16px; cursor: pointer; }
  .word:hover, .char-big:hover { color: #ff7a45; }
  .hint { text-align: center; color: #999; font-size: 13px; margin: 6px 0; }
  .quiz-panel { max-width: 640px; margin: 0 auto; text-align: center; }
  .quiz-py { font-size: 52px; font-family: Arial; color: #1765ad; font-weight: bold; }
  .quiz-char { font-size: 96px; line-height: 1.2; }
  .quiz-ask { font-size: 20px; margin: 6px 0; }
  .action { font-size: 18px; padding: 8px 20px; border: none; border-radius: 20px;
            background: #40a9ff; color: #fff; cursor: pointer; margin: 4px; }
  .action.clear { background: #ff7875; }
  .action.rec { background: #52c41a; font-size: 22px; padding: 12px 28px; }
  .action.rec.listening { background: #ff4d4f; animation: pulse 1s infinite; }
  .action:disabled { opacity: .5; cursor: default; }
  .pick-opts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .pick-opt { font-size: 52px; width: 100px; height: 100px; border-radius: 16px; cursor: pointer;
              border: 3px solid #91caff; background: #f0f8ff; }
  .pick-opt.right { background: #b7eb8f; border-color: #52c41a; }
  .pick-opt.wrong { background: #ffccc7; border-color: #ff4d4f; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .center { text-align: center; }
  .score { text-align: center; font-size: 20px; color: #666; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🌈 拼音乐园</h1>
    <div class="tabs">
      <button class="tab active" data-mode="spell">🔤 拼一拼</button>
      <button class="tab" data-mode="pick">🧩 认一认</button>
      <button class="tab" data-mode="quiz">🎤 读一读</button>
    </div>
  </div>

  <!-- 拼读区：左边选按钮，右边看结果 -->
  <div id="builder" class="layout">
   <div class="pick">
    <div class="panel"><h3>① 选声母 <span class="sub">（a、ai、er 这类韵母自己成音节时选「(无)」）</span></h3>
      <div class="btns" id="initials"></div></div>
    <div class="panel"><h3>② 选介母 <span class="sub">（拼三拼音节才选，双拼跳过这一步）</span></h3>
      <div class="btns" id="medials"></div></div>
    <div class="panel"><h3>③ 选韵母</h3><div class="btns" id="finals"></div></div>
    <div class="panel"><h3>或者：直接选整体认读音节 <span class="sub">（不用拼，整个读）</span></h3>
      <div class="btns" id="wholes"></div></div>
    <div class="panel"><h3>④ 选声调 <span class="sub">（小红点表示有字）</span></h3><div class="btns" id="tones"></div></div>
   </div>

    <div class="panel result">
      <div class="formula" id="formula"></div>
      <div class="big-py" id="bigpy"></div>
      <div id="msgs"></div>
      <div class="chars" id="chars"></div>
      <p class="hint">点一点汉字或词语，可以听读音 🔊</p>
      <div class="center"><button class="action clear" id="clear-btn">🧹 清除，重新拼</button></div>
    </div>
  </div>

  <!-- 认一认：看拼音选出正确的字 -->
  <div id="pick" class="hidden">
    <div class="panel quiz-panel">
      <div class="score" id="pick-score">答对 0 题 / 共 0 题</div>
      <div class="quiz-py" id="pick-py"></div>
      <button class="action" id="pick-listen">🔊 听一听</button>
      <div class="quiz-ask">这个拼音是哪个字？</div>
      <div class="pick-opts" id="pick-opts"></div>
      <div id="pick-msg"></div>
      <div class="chars" id="pick-words"></div>
      <button class="action" id="pick-next">下一题 ➡</button>
    </div>
  </div>

  <!-- 读一读：录音判断读得准不准 -->
  <div id="quiz" class="hidden">
    <div class="panel quiz-panel">
      <div class="score" id="score">读对 0 题 / 共 0 题</div>
      <div class="quiz-py" id="quiz-py"></div>
      <div class="quiz-char" id="quiz-char"></div>
      <div class="quiz-ask" id="quiz-ask"></div>
      <div>
        <button class="action" id="quiz-listen">🔊 听一听</button>
        <button class="action rec" id="quiz-rec">🎤 按一下，开始读</button>
      </div>
      <div id="quiz-msg"></div>
      <div class="center"><button class="action" id="quiz-next">下一题 ➡</button></div>
    </div>
  </div>
</div>

// 把字库整理成：{ "ma1": [{c:"妈", w:["妈妈"]}], ... }
const DICT = {};
const ENTRIES = [];
RAW.trim().split('\n').forEach(line => {
  const [key, c, ...w] = line.trim().split(/\s+/);
  const syl = key.slice(0, -1), tone = Number(key.slice(-1));
  if (!VALID.has(syl)) console.warn('字库里有不合法的音节：', key);
  const item = { syl, tone, c, w };
  (DICT[key] = DICT[key] || []).push(item);
  ENTRIES.push(item);
});

// ================== 发音数据 ==================
// 浏览器语音不会读拼音字母，所以用“代表字”来读出声母、韵母的标准呼读音（与课本一致）
const PART_SOUND = {
  // 声母
  b: '玻', p: '坡', m: '摸', f: '佛', d: '得', t: '特', n: '讷', l: '勒',
  g: '哥', k: '科', h: '喝', j: '基', q: '欺', x: '希',
  zh: '知', ch: '吃', sh: '诗', r: '日', z: '资', c: '雌', s: '思', y: '衣', w: '乌',
  // 单韵母 / 介母
  a: '啊', o: '喔', e: '婀', i: '衣', u: '乌', 'ü': '迂',
  // 复韵母、鼻韵母（ong 没有单独成字，用最接近的“嗡”代替）
  ai: '哀', ei: '欸', ui: '威', ao: '凹', ou: '欧', iu: '优', ie: '耶', 'üe': '约', er: '儿',
  an: '安', en: '恩', in: '因', un: '温', 'ün': '晕',
  ang: '昂', eng: '鞥', ing: '英', ong: '嗡',
  // 整体认读音节
  zhi: '知', chi: '吃', shi: '诗', ri: '日', zi: '资', ci: '雌', si: '思',
  yi: '衣', wu: '乌', yu: '迂', ye: '耶', yue: '约', yuan: '冤', yin: '因', yun: '晕', ying: '英'
};

// 多音字单独读容易读错，改用不会读错的同音字来朗读（键 = 音节+声调+汉字）
const SPEAK_AS = {
  'chang2长': '常', 'zhang3长': '掌', 'huan2还': '环', 'zhi1只': '之',
  'jiao1教': '交', 'jue2觉': '决', 'dou1都': '兜', 'piao4漂': '票',
  'le4乐': '勒', 'shen2什': '神'
};

/** 得到一个字的朗读文本：轻声字单独读不准，读它的词语 */
function sayChar(item) {
  if (item.tone === 0) return item.w[0];
  return SPEAK_AS[item.syl + item.tone + item.c] || item.c;
}

// ================== 工具函数 ==================
const TONE_MARKS = { a: 'āáǎà', o: 'ōóǒò', e: 'ēéěè', i: 'īíǐì', u: 'ūúǔù', 'ü': 'ǖǘǚǜ' };

/** 内部写法(v 代表 ü) → 课本写法 */
function toWritten(syl) { return syl.replace(/v/g, 'ü'); }

/** 给拼音加声调符号：有 a 标 a，没 a 找 o e，i u 并列标在后 */
function addTone(py, tone) {
  if (!tone) return py;
  let idx;
  if (py.includes('a')) idx = py.indexOf('a');
  else if (py.includes('o')) idx = py.indexOf('o');
  else if (py.includes('e')) idx = py.indexOf('e');
  else if (py.includes('iu')) idx = py.indexOf('iu') + 1;
  else if (py.includes('ui')) idx = py.indexOf('ui') + 1;
  else {
    idx = Math.max(py.lastIndexOf('i'), py.lastIndexOf('u'), py.lastIndexOf('ü'));
  }
  const ch = py[idx];
  return py.slice(0, idx) + TONE_MARKS[ch][tone - 1] + py.slice(idx + 1);
}

/** 朗读（浏览器自带中文语音） */
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('这个浏览器不支持朗读，请用 Edge 或 Chrome'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.8;
  speechSynthesis.speak(u);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ================== 拼读逻辑 ==================
const state = { mode: 'spell', initial: null, medial: null, final: null, whole: null, tone: null };

/**
 * 根据当前选择算出音节，返回 { syl(内部写法), kind(音节类型), msgs: [{type, text}] }
 * 规则：选了整体认读 → 整体认读；没选介母 → 双拼；选了介母 → 三拼
 * syl 为 null 表示还没选完或拼法不合法
 */
function compose() {
  const res = composeRaw();
  if (res.syl && !res.kind) {
    if (WHOLES.includes(res.syl)) res.kind = '整体认读音节';
    else if (state.medial) res.kind = '三拼音节';
    else if (state.initial === '') res.kind = '韵母自成音节';
    else res.kind = '双拼音节';
  }
  return res;
}

function composeRaw() {
  const { initial, medial, final, whole } = state;
  const msgs = [];
  if (whole) {
    msgs.push({ type: 'tip', text: `「${whole}」是整体认读音节，要整个读出来，不用拼读。` });
    return { syl: whole, kind: '整体认读音节', msgs };
  }

  if (!medial) {
    if (initial === null || !final) return { syl: null, msgs };
    const ini = initial;   // '' 表示没有声母
    if (['j', 'q', 'x'].includes(ini) && final.startsWith('u')) {
      msgs.push({ type: 'err', text: 'j、q、x 不和 u 相拼，只和 ü 相拼哦！试试选 ü。' });
      return { syl: null, msgs };
    }
    if (final.startsWith('ü') && !['n', 'l', 'j', 'q', 'x', 'y', ''].includes(ini)) {
      msgs.push({ type: 'err', text: '小 ü 很挑朋友，只和 n、l、j、q、x 相拼。' });
      return { syl: null, msgs };
    }
    if (ini === '' && /^(i|u|ü)/.test(final)) {
      msgs.push({ type: 'err', text: 'i、u、ü 开头的韵母自己成音节时，要请 y 或 w 帮忙，比如 i → yi，u → wu，ü → yu。' });
      return { syl: null, msgs };
    }
    let written = ini + final;
    if (['j', 'q', 'x', 'y'].includes(ini) && final.startsWith('ü')) {
      written = ini + final.replace('ü', 'u');
      msgs.push({ type: 'tip', text: `小 ü 见到 ${ini}，去掉两点还读 ü：写成「${written}」。` });
    }
    const syl = written.replace(/ü/g, 'v');
    if (!VALID.has(syl)) {
      msgs.push({ type: 'err', text: `普通话里没有「${written}」这个音节，换一个试试吧！` });
      return { syl: null, msgs };
    }
    if (WHOLES.includes(syl)) {
      msgs.push({ type: 'tip', text: `「${written}」是整体认读音节，要整个读，不用拼读。` });
    }
    return { syl, msgs };
  }

  // 三拼：声母 + 介母 + 韵母
  if (initial === null || !final) return { syl: null, msgs };
  if (initial === '') {
    msgs.push({ type: 'err', text: '没有声母时不用选介母：i、u、ü 开头要请 y 或 w 帮忙，比如 y-a → ya，w-a → wa。' });
    return { syl: null, msgs };
  }
  if (initial === 'y' || initial === 'w') {
    msgs.push({ type: 'err', text: `${initial} 后面不用再加介母，直接选韵母就行，比如 ${initial}-a → ${initial}a。` });
    return { syl: null, msgs };
  }
  if (!FINALS_THREE.includes(final)) {
    const joined = medial + final;
    msgs.push({ type: 'err', text: FINALS_TWO.includes(joined)
      ? `${medial} 和 ${final} 合起来就是韵母「${joined}」，请取消介母，直接选韵母 ${joined}，这是双拼音节。`
      : `介母 ${medial} 不能和韵母 ${final} 一起拼，三拼的韵母只有 a、o、ai、ao、an、ang、ong。` });
    return { syl: null, msgs };
  }
  if (medial === 'ü' && !['j', 'q', 'x'].includes(initial)) {
    msgs.push({ type: 'err', text: '三拼音节里，ü 只和 j、q、x 相拼，比如 j-ü-an → juan。' });
    return { syl: null, msgs };
  }
  if (medial === 'u' && ['j', 'q', 'x'].includes(initial)) {
    msgs.push({ type: 'err', text: 'j、q、x 不和 u 相拼，只和 ü 相拼哦！' });
    return { syl: null, msgs };
  }
  let written = initial + medial + final;
  if (medial === 'ü') {
    written = initial + 'u' + final;
    msgs.push({ type: 'tip', text: `小 ü 见到 ${initial}，去掉两点还读 ü：写成「${written}」。` });
  }
  if (!VALID.has(written)) {
    msgs.push({ type: 'err', text: `普通话里没有「${written}」这个音节，换一个试试吧！` });
    return { syl: null, msgs };
  }
  return { syl: written, msgs };
}

/** 刷新结果区 */
function render() {
  const { syl, kind, msgs } = compose();
  const formula = document.getElementById('formula');
  const bigpy = document.getElementById('bigpy');
  const msgBox = document.getElementById('msgs');
  const chars = document.getElementById('chars');
  msgBox.innerHTML = ''; chars.innerHTML = '';
  syncSelected();

  // 拼读公式，例如 g - u - a → gua  [三拼音节]
  const show = p => p === null ? '?' : p === '' ? '(无)' : p;
  const parts = state.whole ? [state.whole]
    : state.medial ? [state.initial, state.medial, state.final].map(show)
    : [state.initial, state.final].map(show);
  formula.textContent = parts.join(' - ') + (syl && !state.whole ? ' → ' + toWritten(syl) : '');
  if (kind) formula.appendChild(el('span', 'kind', kind));

  // 声调按钮：有字的声调加小红点
  document.querySelectorAll('#tones .py-btn').forEach(b => {
    b.classList.toggle('has', !!(syl && DICT[syl + b.dataset.t]));
  });

  msgs.forEach(m => msgBox.appendChild(el('div', 'msg ' + m.type, m.text)));
  if (!syl) { bigpy.textContent = ''; return; }

  const written = toWritten(syl);
  if (state.tone === null) {
    bigpy.textContent = written;
    msgBox.appendChild(el('div', 'msg tip', '拼对啦！再选一个声调，看看能组成什么字。'));
    return;
  }
  bigpy.textContent = (state.tone === 0 ? '·' : '') + addTone(written, state.tone);

  const list = DICT[syl + state.tone];
  if (!list) {
    msgBox.appendChild(el('div', 'msg err', '这个声调没有收录常用字，试试带小红点的声调吧！'));
    return;
  }
  msgBox.appendChild(el('div', 'msg ok', `🎉 找到 ${list.length} 个字！`));
  list.forEach(item => chars.appendChild(charCard(item)));
}

/** 生成一个汉字卡片：大字 + 组词 */
function charCard(item) {
  const card = el('div', 'char-card');
  const big = el('div', 'char-big', item.c);
  big.onclick = () => speak(sayChar(item));
  card.appendChild(big);
  const words = el('div');
  item.w.forEach(w => {
    const s = el('span', 'word', w);
    s.onclick = () => speak(w);
    words.appendChild(s);
  });
  card.appendChild(words);
  return card;
}

/** 生成一组可单选的按钮 */
function makeButtons(containerId, items, cls, field, labelFn) {
  const box = document.getElementById(containerId);
  box.innerHTML = '';
  items.forEach(v => {
    const b = el('button', 'py-btn ' + cls, labelFn ? labelFn(v) : v);
    b.dataset.field = field;
    b.dataset.v = v;
    if (field === 'tone') b.dataset.t = v;
    b.onclick = () => {
      state[field] = state[field] === v ? null : v;   // 再点一次取消
      // 整体认读和“声母+介母+韵母”二选一：选了一边就清掉另一边
      if (state[field] !== null) {
        if (field === 'whole') Object.assign(state, { initial: null, medial: null, final: null });
        else if (field !== 'tone') state.whole = null;
      }
      render();
      if (state[field] !== null) speakPick(field, v);   // 取消选择时不读
    };
    box.appendChild(b);
  });
}

/** 按 state 刷新所有按钮的选中样式 */
function syncSelected() {
  document.querySelectorAll('#builder .py-btn').forEach(b => {
    const cur = state[b.dataset.field];
    b.classList.toggle('sel', cur !== null && String(cur) === b.dataset.v);
  });
}

/**
 * 点击按钮后的朗读：
 * - 点声母/介母/韵母/整体认读：读这个音的标准呼读音
 * - 点声调：读出拼成的字；没有字就语音提示
 */
function speakPick(field, value) {
  if (field !== 'tone') {
    if (value !== '' && PART_SOUND[value]) speak(PART_SOUND[value]);   // “(无)”声母不读
    return;
  }
  const { syl } = compose();
  if (!syl) { speak('请先拼出正确的音节'); return; }
  const list = DICT[syl + value];
  if (!list) { speak('没有对应的字'); return; }
  speak(list.map(sayChar).join('，'));   // 同音的几个字依次读出
}

/** 切换模式 */
function setMode(mode) {
  Object.assign(state, { mode, initial: null, medial: null, final: null, whole: null, tone: null });
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  const show = (id, on) => document.getElementById(id).classList.toggle('hidden', !on);

  show('builder', mode === 'spell');
  show('pick', mode === 'pick');
  show('quiz', mode === 'quiz');
  if (mode === 'quiz') { quiz.right = quiz.total = 0; nextQuiz(); return; }
  stopListening();   // 离开“读一读”时关掉麦克风
  if (mode === 'pick') { pickQuiz.right = pickQuiz.total = 0; nextPick(); return; }

  makeButtons('initials', ['', ...INITIALS], 'g-initial', 'initial', v => v === '' ? '(无)' : v);
  makeButtons('medials', MEDIALS, 'g-medial', 'medial');
  makeButtons('finals', FINALS_TWO, 'g-final', 'final');
  makeButtons('wholes', WHOLES, 'g-whole', 'whole');
  makeButtons('tones', TONES.map(x => x.t), 'g-tone', 'tone', t => TONES.find(x => x.t === t).label);
  render();
}

// ================== 读一读（录音判断读音） ==================
// 每个字在字库里的读音，用来把识别出的字反查成拼音，例如 { 马: ['ma3'] }
const READINGS = {};
ENTRIES.forEach(e => (READINGS[e.c] = READINGS[e.c] || []).push(e.syl + e.tone));
// 多音字的朗读替代字（如 常）也算同音字
Object.entries(SPEAK_AS).forEach(([k, c]) => (READINGS[c] = READINGS[c] || []).push(k.slice(0, -1)));

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
// stage：'char' 先读字，'word' 字没读准再读词；done 表示这题结束
const quiz = { answer: null, stage: 'char', done: false, right: 0, total: 0, listening: false };

/** 显示 'ma3' 这样的读音为带调拼音 */
function showPy(key) {
  const tone = Number(key.slice(-1));
  return (tone === 0 ? '·' : '') + addTone(toWritten(key.slice(0, -1)), tone);
}

/** 当前要读的内容：字 或 词 */
function quizTarget() {
  return quiz.stage === 'char' ? quiz.answer.c : quiz.answer.w[0];
}

function quizMsg(type, text) {
  const box = document.getElementById('quiz-msg');
  box.innerHTML = '';
  if (text) box.appendChild(el('div', 'msg ' + type, text));
}

function nextQuiz() {
  stopListening();
  const ans = ENTRIES[Math.floor(Math.random() * ENTRIES.length)];
  // 轻声字单独读不准，直接读词
  Object.assign(quiz, { answer: ans, stage: ans.tone === 0 ? 'word' : 'char', done: false });
  quiz.total++;
  document.getElementById('quiz-py').textContent = showPy(ans.syl + ans.tone);
  updateQuizView();
  quizMsg('tip', Recognition ? '先看拼音读一读，再按绿色按钮读给我听。'
    : '这个浏览器不支持录音识别：电脑请用 Edge 或 Chrome，iPad 请用 Safari 打开。');
  document.getElementById('quiz-rec').disabled = !Recognition;
}

function updateQuizView() {
  const word = quiz.stage === 'word';
  document.getElementById('quiz-char').textContent = quizTarget();
  document.getElementById('quiz-ask').textContent = word ? '读一读这个词语：' : '读一读这个字：';
  document.getElementById('score').textContent = `读对 ${quiz.right} 题 / 共 ${quiz.total} 题`;
}

/**
 * 判断识别结果是否读对
 * texts：识别器给出的几个候选文本
 * 返回 { ok, heard }，heard 是听到的内容（读错时用来提示）
 */
function judge(texts) {
  const ans = quiz.answer, key = ans.syl + ans.tone;
  for (const raw of texts) {
    const t = raw.replace(/[\s，。！？、,.!?]/g, '');
    if (quiz.stage === 'word' && t.includes(ans.w[0])) return { ok: true };
    // 识别出目标字，或者同音同调的字（如 他/她/它）都算读对
    if ([...t].some(ch => ch === ans.c || (READINGS[ch] || []).includes(key))) return { ok: true };
  }
  return { ok: false, heard: texts[0] ? texts[0].replace(/[\s，。！？、,.!?]/g, '') : '' };
}

/** 读错时给提示：如果听到的字在字库里，告诉孩子听起来像哪个音 */
function wrongHint(heard) {
  if (!heard) return '没有听清楚，靠近一点，大声再读一次吧！';
  const ch = [...heard].find(c => READINGS[c]);
  const like = ch ? `（${showPy(READINGS[ch][0])}）` : '';
  return `听起来像「${heard}」${like}，注意声调哦！`;
}

function onHeard(texts) {
  if (quiz.done) return;
  const { ok, heard } = judge(texts);
  if (ok) {
    quiz.done = true; quiz.right++;
    updateQuizView();
    const stars = quiz.stage === 'char' ? '⭐⭐⭐' : '⭐⭐';
    quizMsg('ok', `${stars} 读得真准！`);
    speak('读得真准');
    return;
  }
  if (quiz.stage === 'char') {
    // 单个字读不准（也可能是识别不准），换成词语再试一次
    quiz.stage = 'word';
    updateQuizView();
    quizMsg('err', wrongHint(heard) + ' 换成词语再读一次试试～');
    speak(quizTarget());
  } else {
    quizMsg('err', wrongHint(heard) + ' 先点「听一听」，再读一次。');
  }
}

let recognizer = null;

function startListening() {
  if (!Recognition || quiz.done || quiz.listening) return;
  speechSynthesis.cancel();   // 别把电脑自己的声音录进去
  recognizer = new Recognition();
  recognizer.lang = 'zh-CN';
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 5;
  recognizer.onresult = e => onHeard([...e.results[0]].map(a => a.transcript));
  recognizer.onerror = e => {
    const tips = {
      'no-speech': '没有听到声音，按一下按钮后马上读哦！',
      'not-allowed': location.protocol === 'https:'
        ? '麦克风没有打开：电脑请在地址栏左边允许；iPad 请到「设置 → Safari → 麦克风」里允许，再打开「设置 → 隐私与安全性 → 语音识别」。'
        : '录音需要用 https 网址打开，直接打开文件或局域网地址不能用麦克风。',
      'service-not-allowed': 'iPad 请到「设置 → 隐私与安全性 → 语音识别」里允许，并确认 Siri 已开启。',
      'audio-capture': '没有找到麦克风，请检查设备的麦克风。',
      'network': '识别需要联网，请检查网络。'
    };
    quizMsg('err', tips[e.error] || '出了点小问题：' + e.error);
  };
  recognizer.onend = () => setListening(false);
  recognizer.start();
  setListening(true);
  quizMsg('tip', '👂 正在听……请读出来');
}

function stopListening() {
  if (recognizer) { recognizer.onend = null; recognizer.abort(); recognizer = null; }
  setListening(false);
}

function setListening(on) {
  quiz.listening = on;
  const btn = document.getElementById('quiz-rec');
  btn.classList.toggle('listening', on);
  btn.textContent = on ? '👂 正在听…' : '🎤 按一下，开始读';
}

document.getElementById('quiz-rec').onclick = startListening;
document.getElementById('quiz-listen').onclick = () => {
  speak(quiz.stage === 'char' ? sayChar(quiz.answer) : quizTarget());
};
document.getElementById('quiz-next').onclick = nextQuiz;

// ================== 认一认（看拼音选字） ==================
const pickQuiz = { answer: null, done: false, missed: false, right: 0, total: 0 };

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

function nextPick() {
  const ans = ENTRIES[Math.floor(Math.random() * ENTRIES.length)];
  // 干扰项：读音不同的其他字，避免出现两个正确答案
  const others = shuffle(ENTRIES.filter(e => e.syl + e.tone !== ans.syl + ans.tone));
  const opts = [ans.c];
  for (const o of others) {
    if (!opts.includes(o.c) && !(READINGS[o.c] || []).includes(ans.syl + ans.tone)) opts.push(o.c);
    if (opts.length === 4) break;
  }
  Object.assign(pickQuiz, { answer: ans, done: false, missed: false });
  pickQuiz.total++;

  document.getElementById('pick-py').textContent = showPy(ans.syl + ans.tone);
  document.getElementById('pick-msg').innerHTML = '';
  document.getElementById('pick-words').innerHTML = '';
  document.getElementById('pick-score').textContent = `答对 ${pickQuiz.right} 题 / 共 ${pickQuiz.total} 题`;
  const box = document.getElementById('pick-opts');
  box.innerHTML = '';
  shuffle(opts).forEach(c => {
    const b = el('button', 'pick-opt', c);
    b.onclick = () => checkPick(b, c);
    box.appendChild(b);
  });
}

function checkPick(btn, c) {
  if (pickQuiz.done) return;
  const ans = pickQuiz.answer;
  const msg = document.getElementById('pick-msg');
  msg.innerHTML = '';
  if (c === ans.c) {
    pickQuiz.done = true;
    if (!pickQuiz.missed) pickQuiz.right++;   // 第一次就选对才算对
    btn.classList.add('right');
    msg.appendChild(el('div', 'msg ok', '⭐ 太棒了，答对啦！'));
    document.getElementById('pick-words').appendChild(charCard(ans));
    speak(sayChar(ans));
  } else {
    pickQuiz.missed = true;
    btn.classList.add('wrong');
    msg.appendChild(el('div', 'msg err', '再想想，听一听读音试试 🔊'));
  }
  document.getElementById('pick-score').textContent = `答对 ${pickQuiz.right} 题 / 共 ${pickQuiz.total} 题`;
}

document.getElementById('pick-listen').onclick = () => speak(sayChar(pickQuiz.answer));
document.getElementById('pick-next').onclick = nextPick;
// 清除：停止朗读，清空当前页签的所有选择，等待重新拼
document.getElementById('clear-btn').onclick = () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  setMode(state.mode);
};
document.querySelectorAll('.tab').forEach(t => t.onclick = () => setMode(t.dataset.mode));
setMode('spell');

// 注册离线缓存（只在 https 或 localhost 下生效，直接双击打开文件时会自动跳过）
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
